  }

  .stopCard {
    background: #fff; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06); display: flex; gap: 10px; align-items: flex-start;
    border-left: 5px solid #2E74B5; cursor: pointer;
  }
  input.doneChk:checked + .stopCard { opacity: 0.45; }
  .chk {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid #ccc; flex-shrink: 0;

  .badge { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 10px; margin-left: 6px; font-weight: 700; }
  .badge.must { background: #fde2e2; color: #a91d1d; }
  .badge.resv { background: #fff0d6; color: #8a5a00; }
  .wpNum {

  .day2 .wpNum { background: #C0392B; }

  .hint { font-size: 11px; color: #999; text-align: center; margin: 14px 0 4px; }
